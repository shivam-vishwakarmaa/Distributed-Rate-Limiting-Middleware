name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Lint
      run: staticcheck ./...

    - name: Unit Tests
      run: go test -v ./test/unit/...

    - name: Start Server
      run: |
        go build -o demo-backend ./demo/backend
        ./demo-backend &
        for i in {1..30}; do
          if curl -s -f http://localhost:8081/ > /dev/null; then
            echo "Backend is up!"
            break
          fi
          echo "Waiting for backend..."
          sleep 1
        done

        go build -o server ./cmd/server
        ./server &
        for i in {1..30}; do
          if curl -s -f http://localhost:8080/health > /dev/null; then
            echo "Server is up!"
            exit 0
          fi
          echo "Waiting for server..."
          sleep 1
        done
        echo "Server failed to start"
        exit 1

    - name: Integration Tests
      run: go test -v -tags=integration ./test/integration/...

    - name: Stop Server
      if: always()
      run: |
        pkill -f ./server || true
        pkill -f ./demo-backend || true
